<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金枝共鸣启动器</title>
    <style>
        /* 这里是一些简单的样式，让网页看起来不那么简陋 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e; /* 深色背景 */
            color: #ffffff;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            background-color: #2d2d2d;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            color: #f1c40f; /* 金色字体 */
        }
        p {
            line-height: 1.6;
            color: #b3b3b3;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ 金枝共鸣启动器 ✨</h1>
        <p>在指定程序启动时，把绿幕素材抠像后以透明叠加层播放到屏幕上（Windows / PySide6）。</p>
        
        <!-- 这里加一个链接，方便别人去看你的源码 -->
        <a href="https://github.com/yuanlvsx/-" class="btn" target="_blank">查看 GitHub 源码</a>
    </div>

</body>
</html>
